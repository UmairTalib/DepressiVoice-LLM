# DepressiVoice-LLM Project Configuration
# This file centralizes project paths and parameters

# Project paths
paths:
  raw_data: "data/01_raw/"
  transcribed_data: "data/02_transcribed/"
  processed_data: "data/03_processed/"
  results: "data/04_results/"

# Data processing parameters
data_processing:
  manifest_filename: "metadata_mapped.csv"
  
# Audio processing settings
audio:
  sample_rate: 16000
  format: "wav"
  
# Model configuration
model:
  whisper_model: "base"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  
# Training parameters
training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  validation_split: 0.2
