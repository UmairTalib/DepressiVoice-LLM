# DepressiVoice-LLM Phase 2 Configuration
# Status: Phase 2 (Multimodal Modeling)

paths:
  # Local paths (Synced from Cluster)
  phase1_metadata: "data/processed/phase1/session_outputs"
  reports: "data/processed/phase1/final_lock_bundle"
  
  # Remote Cluster paths (For large audio training)
  cluster_audio_root: "/home/g755389/DepressiVoice-LLM/session_outputs"
  
data_processing:
  metadata_filename: "cleaned_transcript.json" # V3 Repaired Metadata

model:
  text_encoder: "mental/mental-roberta-base"
  audio_encoder: "microsoft/wavlm-large"
  audio_layer_indices: [6, 7, 8, 9, 10, 11, 12] # Middle layers for prosody
  fusion_type: "cross_attention"
  
training:
  batch_size: 16
  learning_rate: 2.0e-5
  max_epochs: 20
  gradient_accumulation: 4
  num_workers: 4
  seed: 42

validations:
  purity_threshold: 0.5 # Strictness for any new data
